name: Check data pipeline

# Rebuilds 2025-26 from live MoneyPuck files and compares it with the committed data, so a
# change to the pipeline (or a MoneyPuck format change) shows up before it reaches the site.
on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild 2025-26 from MoneyPuck
        run: python pipeline/build_data.py --seasons 2025 --out "$RUNNER_TEMP/out"

      - name: Compare with committed data
        run: python pipeline/compare.py data/2025 "$RUNNER_TEMP/out/2025"
